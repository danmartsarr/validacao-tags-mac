<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#202327">
  <meta name="color-scheme" content="dark">
  <title>Validação · Acervo MAC USP</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='2' fill='%23202327'/%3E%3Cpath d='M4 8.5l2.5 2.5L12 5.5' fill='none' stroke='%23fff' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="preload" href="fontes/archivo.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/estilo.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <a class="pular" href="#principal">Pular para o conteúdo</a>
  <header class="topo" hidden>
    <a class="marca" href="#/lote">Validação</a>
    <nav class="abas" aria-label="Seções">
      <a href="#/lote" data-aba="lote">Lote</a>
      <a href="#/obra" data-aba="obra">Validar</a>
    </nav>
    <div class="quem">
      <span class="placar"><b class="placar-feitas"></b> de <span class="placar-total"></span> obras</span>
      <span class="sincronia" aria-live="polite"><i class="sinc-ponto" aria-hidden="true"></i><span class="sinc-texto"></span></span>
      <details class="menu">
        <summary aria-label="Menu da conta"><span class="usuario"></span></summary>
        <div class="menu-painel">
          <button type="button" data-acao="sincronizar">Sincronizar agora</button>
          <button type="button" data-acao="json">Baixar validações (JSON)</button>
          <button type="button" data-acao="csv">Baixar validações (CSV)</button>
          <button type="button" data-acao="sair">Trocar de pessoa</button>
        </div>
      </details>
    </div>
    <div class="progresso" role="progressbar" aria-label="Progresso do lote" aria-valuemin="0"><span class="progresso-barra"></span></div>
  </header>
  <main id="principal" tabindex="-1"></main>
  <dialog class="zoom" aria-label="Imagem ampliada">
    <button type="button" class="zoom-fechar">Fechar</button>
    <div class="zoom-palco"><img alt=""></div>
  </dialog>
  <div class="aviso" role="status" aria-live="polite"></div>
</body>
</html>
